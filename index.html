:root{

*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--ground);color:var(--ink);font-family:var(--serif);

header,footer{display:flex;justify-content:space-between;align-items:center;gap:16px;

main{display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(22px,4vh,40px);padding:clamp(32px,8vh,80px) 0}

footer a{padding:12px 0;display:inline-block}
@media (max-width:600px){ header{font-size:11px;letter-spacing:.36em} .logo{width:min(320px,88vw)} }
@media (prefers-reduced-motion:no-preference){
